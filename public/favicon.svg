<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- JTracker logo, "The Tick": a j that is also a check mark; the dot is the offer.
       Navy tile on light, violet tile when the browser is in dark mode. -->
  <style>
    .tile { fill: #202D64; }
    @media (prefers-color-scheme: dark) { .tile { fill: #7768F6; } }
  </style>
  <rect class="tile" width="64" height="64" rx="18"/>
  <path d="M17 32v5c0 6 4 10 10 10c5 0 8-3 10-8l6.5-16" fill="none" stroke="#F9FAFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="47.6" cy="13.2" r="4.6" fill="#6AF0C2"/>
</svg>
