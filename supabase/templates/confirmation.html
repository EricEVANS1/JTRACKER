<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your JTracker email address</title>
</head>
<body style="margin:0;background:#f1f5f9;color:#0f172a;font-family:Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#fff;border-radius:16px;">
          <tr>
            <td style="padding:28px;">
              <p style="margin:0 0 24px;font-size:20px;font-weight:bold;">JTracker</p>
              <h1 style="margin:0 0 16px;font-size:26px;line-height:1.25;">Confirm your email address</h1>
              <p style="margin:0 0 24px;font-size:16px;line-height:1.6;">Confirm your email to finish setting up your JTracker account and start tracking your job applications.</p>
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;border-radius:8px;background:#0f172a;color:#fff;font-weight:bold;text-decoration:none;">Confirm email address</a>
              <p style="margin:24px 0 0;font-size:14px;line-height:1.6;color:#475569;">If you didn’t create a JTracker account, you can ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
