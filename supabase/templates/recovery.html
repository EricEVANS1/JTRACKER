<h2>Reset your JTracker password</h2>
<p>Use the button below to choose a new password for your JTracker account.</p>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}" style="display:inline-block;padding:14px 22px;border-radius:8px;background:#0f172a;color:#fff;font-weight:bold;text-decoration:none;">Reset password</a></p>
<p>If you didn’t request a password reset, you can ignore this email.</p>
